<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, 'Times New Roman', serif; background: #f5f0eb;
       display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── top bar ── */
#topbar {
  flex-shrink: 0;
  background: rgba(255,255,255,0.97);
  border-bottom: 1px solid #ccc;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
  padding: 8px 14px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  z-index: 1000;
}
#topbar .title { font-size: 15px; font-weight: bold; color: #2c3e50; white-space: nowrap; }
#topbar .nav-link { font-size: 12px; color: #666; text-decoration: none; white-space: nowrap; }
#topbar .nav-link:hover { color: #2c3e50; text-decoration: underline; }
.filter-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.filter-label { font-size: 11px; color: #888; white-space: nowrap; }
.pill {
  font-size: 11px; padding: 3px 9px; border-radius: 12px; cursor: pointer;
  border: 1px solid #bbb; background: white; color: #555;
  transition: background 0.12s, color 0.12s;
}
.pill.active { background: #2c3e50; color: white; border-color: #2c3e50; }
.pill:hover:not(.active) { background: #eee; }
.date-group { display: flex; align-items: center; gap: 6px; }
.date-group span { font-size: 11px; color: #555; min-width: 28px; text-align: center; }
.date-group input[type=range] { width: 90px; accent-color: #2c3e50; cursor: pointer; }
.sep { color: #ccc; font-size: 14px; }

/* ── main area ── */
#main { flex: 1; display: flex; overflow: hidden; }
#map  { flex: 0 0 65%; }
#panel {
  flex: 0 0 35%;
  border-left: 1px solid #ddd;
  background: #faf9f7;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* ── panel header ── */
#panel-header {
  padding: 12px 14px 8px;
  border-bottom: 1px solid #e0dbd4;
  flex-shrink: 0;
}
#panel-title {
  font-size: 15px; font-weight: bold; color: #2c3e50; margin-bottom: 3px;
}
#panel-stats { font-size: 11px; color: #888; margin-bottom: 8px; }
.panel-pills { display: flex; gap: 5px; flex-wrap: wrap; }

/* ── panel placeholder ── */
#panel-placeholder {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center; color: #aaa; font-style: italic;
  font-size: 13px; line-height: 1.6;
}

/* ── evidence list ── */
#evidence-list {
  flex: 1; overflow-y: auto; padding: 10px 12px;
}
.ev-card {
  background: white; border: 1px solid #e0dbd4; border-radius: 5px;
  padding: 10px 12px; margin-bottom: 8px;
  font-size: 12px; line-height: 1.5;
}
.ev-card-head {
  display: flex; align-items: baseline; gap: 7px; margin-bottom: 3px;
  flex-wrap: wrap;
}
.source-badge {
  border-radius: 3px; padding: 1px 6px; font-size: 10px;
  font-weight: bold; text-transform: uppercase; letter-spacing: 0.03em;
  flex-shrink: 0;
}
.src-fiction    { background: #dbe8f5; color: #1a5276; }
.src-diary      { background: #d5f0e0; color: #1a7a42; }
.src-topography { background: #f5e9d5; color: #7d4e1a; }
.src-poetry     { background: #ecdaf5; color: #5b1a7a; }
.src-letters    { background: #e8e8e8; color: #444; }
.src-legal      { background: #f5e0e0; color: #8b1a1a; }
.ev-author { font-weight: bold; color: #2c3e50; }
.ev-title  { color: #555; font-style: italic; }
.ev-date   { font-size: 10px; color: #999; margin-bottom: 5px; }
.ev-text   { color: #333; font-style: italic; line-height: 1.55; }
.ev-footer { display: flex; justify-content: flex-end; margin-top: 5px; }
.context-chip {
  background: #f0ede8; color: #666; border-radius: 3px;
  padding: 1px 6px; font-size: 10px; font-style: normal;
}
.valence-pip {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
  margin-left: 4px; align-self: center;
}
.valence-pip.unpleasant { background: #c0392b; opacity: 0.55; }
.valence-pip.pleasant   { background: #9a6f2a; opacity: 0.55; }
.no-evidence {
  text-align: center; color: #aaa; font-style: italic;
  font-size: 12px; padding: 20px 0;
}
</style>

 of Sophia towards her aunt.\n\nSophia kept silence during the foregoing speech of her father, nor did\nshe once answer otherwise than with a sigh; but as he understood none\nof the language, or, as he called it, lingo of the eyes, so he was not","context":"silence","valence":null},{"source_type":"fiction","author":"Fielding","title":"Tom Jones","pub_year":1749,"date_min":1745,"date_max":1745,"modality":"auditory","text":"-d b-- to me? answer me that. What, I suppose you\ndespise your father too, and don't think him good enough to speak to?”\n\n“For Heaven's sake, sir,” answered Sophia, “do not give so cruel a\nturn to my silence. I am sure I would sooner die than be guilty of any\ndisrespect towards you; but how can I venture to speak, when every\nword must either offend my dear papa, or convict me of the blackest\ningra","context":"silence","valence":null},{"source_type":"fiction","author":"Fielding","title":"Tom Jones","pub_year":1749,"date_min":1745,"date_max":1745,"modality":"auditory","text":"ther to me.”\n\n“And a second wife to me too,” returned Western; “so you will take her\npart too! You won't confess that she hath acted the part of the vilest\nsister in the world?”\n\n“Upon my word, sir,” cries Sophia, “I must belie my heart wickedly if\nI did. I know my aunt and you differ very much in your ways of\nthinking; but I have heard her a thousand times express the greatest\naffection for you;","context":"cries","valence":null},{"source_type":"fiction","author":"Fielding","title":"Tom Jones","pub_year":1749,"date_min":1745,"date_max":1745,"modality":"auditory","text":"er better.”\n\n“The English of all which is,” answered the squire, “that I am in the\nwrong. Ay, certainly. Ay, to be sure the woman is in the right, and\nthe man in the wrong always.”\n\n“Pardon me, sir,” cries Sophia. “I do not say so.”\n\n“What don't you say?” answered the father: “you have the impudence to\nsay she's in the right: doth it not follow then of course that I am in\nthe wrong? And 'd over the Houses, and hearing some Noise, he took the Prisoner running a-cross the Leads, that he was very B","context":"Noise","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17300828-76","pub_year":1730,"date_min":1730,"date_max":1730,"modality":"auditory","text":"er three Gold Rings, value 50 s. the 29th of October last. Mary Philips, alias Harvey, alias Macheing depos'd, That the last Lord Mayor's Day at Night, she being in Windmill-Street , did hear a great Noise, and going out, and inquiring what was the Matter, was told, that there was the Willis's, the Informers, and hearing her S","context":"Noise","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17301014-68","pub_year":1730,"date_min":1730,"date_max":1730,"modality":"auditory","text":"last. Mr. Fenwick depos'd, That on the 7th of September last, at Night, his House was made fast, the Door lock'd, &c. and about Two o'Clock in the Morning his Wife waked him, telling him, she heard a Noise or","context":"Noise","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17311013-48","pub_year":1731,"date_min":1731,"date_max":1731,"modality":"auditory","text":"ich Wound he languishing, liv'd till the 17th of September, and then dy'd . He was indicted a second Time for the unlawful slaying the said William Metcalf. Charles Cranwel depos'd, That he hearing a Noise in the Street, about 8 o'Clock at Night, the 30th of August, he went out","context":"Noise","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17320906-49","pub_year":1732,"date_min":1732,"date_max":1732,"modality":"visual","text":"65. Benjamin Loveday , alias Lowder , was indicted for that he being an ill-dispos'd Person, and greedy of filthy Lucre, did (after the first Day of June, 1723, that is to say ) on the 13th of July last, send to Charles Fairchild a Letter without ee o","context":"noise","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16771212-8","pub_year":1677,"date_min":1677,"date_max":1677,"modality":"crowd","text":"low and his wife , the man being indicted for two Facts, stealing of a Mare, and of Linnen ; the woman for a Smock : both refused to plead, insomuch that the terrible Sentence of Pein fort & dure (or pressing) past, but not being recorded, and they on view of the Press, and Mr. Ordinary's pressing and pious Exhortations not at once to cast away their lives and their souls, submitting themselves, w","context":"Press","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16780703-3","pub_year":1678,"date_min":1678,"date_max":1678,"modality":"visual","text":"The next was a young fellow for a filthy bruitish offence being Arrained on the Statute of 18 Eliz. cap. 7. for having the Carnal knowledgeof a Maiden Child , under the Age of Ten years , The case was thus, (as far as 'tis necessary o","context":"filthy","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16780703-8","pub_year":1678,"date_min":1678,"date_max":1678,"modality":"auditory","text":"The second, was a person charged with killing his Wife . The matter of fact was thus: On the 21 of May , about eleven a clock at night a noise, and, as some said, a crying out was heard; and Neighbours coming out, found this woman lying at her own door almost dead, but no body near her: they carried her into an house, and using means b","context":"noise","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16781016-10","pub_year":1678,"date_min":1678,"date_max":1678,"modality":"auditory","text":"a Gentlemans house in St. Andrews Holborn , observ'd a Lady lay by a Mantua-Gown, and other rich cloaths in a low room; and leaving his shooes at door, goes in and gets them up : but she hearing some ":"mist","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16940830-6","pub_year":1694,"date_min":1694,"date_max":1694,"modality":"crowd","text":"s going down Knight-Rider's-street , the two Prisoners and another, who lookt like a Gentleman, were standing in an Alley, playing with Farthings amongst some Children, and when he came to them, they jostled him, and turned him quite round, and immediately he mist his money, so he taxed them","context":"jostled","valence":"unpleasant"}]},{"id":"LON082","name":"Smithfield Market","lat":51.5188,"lon":-0.1008,"evidence":[{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16840903-3","pub_year":1684,"date_min":1684,"date_max":1684,"modality":"visual","text":"Richard Wheate , of the Parish of Paddington , Indicted for Stealing a dark Brown Gelding , the Goods of Francis Allen : the matter of Fact against him being, that the said Gelding was found in the Possession of the said Wheate. But Wheate produced his Witness that he bo","context":"dark","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16881205-12","pub_year":1688,"date_min":1688,"date_max":1688,"modality":"auditory","text":"his back at a place called Southern, in the County of Middlesex, where they were seized together. To this he pleaded Justification, insisting, That he bought that Horse in Smithfield, though without Tolling; saying, He had lived a considerable Time with a person in Sou","context":"Tolling","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16891009-44","pub_year":1689,"date_min":1689,"date_max":1689,"modality":"crowd","text":"nd publishing a scandalous Libel, Intituled, Elementa Politica: Or, The Grounds of Government opened, &c. Being ask'd what he could say for himself, answer'd, That he was Guilty of carrying it to the Press, but did not know what was intended by the Paper. The Court told asant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17500912-21","pub_year":1750,"date_min":1750,"date_max":1750,"modality":"crowd","text":"526. Sarah Badge , spinster , was indicted for stealing 3 yards of muslin, val. 10 s. one muslin handkerchief, one cambric mob, one cambric apron, one muslin apron, 3 yards and half of holland, one linen shift, one linen sheet, one pair of silk stockings, three yards of lawn, the goods of James King , in the dwelling hous","context":"mob","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17510116-4","pub_year":1751,"date_min":1751,"date_max":1751,"modality":"auditory","text":"t value 10 s. the goods of Albert Nesbit , Esq ; Dec. 24 . || William Martin . On Christmas Eve between 7 and 8 o'clock, the prisoner took my hat off my head and ran away with it. I ran after him and cry'd stop thief. Two men stopped him. Q. Whose servant are you? Martin. I am servant to Albert Nesbit, Esq; this is a hat he provided for me; I had wore it but two or three times. Arthur Smith . I am","context":"cry","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17520914-26","pub_year":1752,"date_min":1752,"date_max":1752,"modality":"visual","text":"431, 432. (M.) James Penprice , and Edward Perry , were indicted for stealing one hog, val. 15 s. the property of Joel Chapman , June 1 . Joel Chapman . I live near Mud-dock, in Rotherhith , and lost a sow pig in the night between the 1st and second of June. I shut her up, and heard my dog bark, and my pig squeak, between twelve and one. The pig had a spot or two","context":"Mud","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17541023-33","pub_year":1754,"date_min":1754,"date_max":1754,"modality":"crowd","text":"Tree . On the 26th of Sept. passing by Pye Corner , betwixt 11 and 12 at noon, I was surrounded by 3 or 4 fellows, I believe there ich he delivered to the waterman; some time after","context":"Dark","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17750426-66","pub_year":1775,"date_min":1775,"date_max":1775,"modality":"auditory","text":"ight of pickled salmon, value 20 s. and a woollen cloth great coat, value 4 s . the property of Robert Steward , March 21st . Robert Steward . I was asleep on board a boat at Billingsgate , I heard a noise, I was alarmed, I got up, and caught the prisoner in the very fact; he had removed it from the hatchway, and was endeavouring to make off; we secured him. Richard Griffin . Steward, the last wit","context":"noise","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17800628-40","pub_year":1780,"date_min":1780,"date_max":1780,"modality":"visual","text":"in monies, numbered , the property of Benjamin Evans , June 16th . BENJAMIN EVANS sworn. Upon the 16th of June I had been to Billingsgate to buy some fish for my master; returning home with it, in a narrow court, I saw the prisoner standing at a door. She said she wanted to speak to me. I went through a passage into a kitchen. I stood in the middle of the kitchen, she stood by my side; she put on","context":"narrow","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17830604-62","pub_year":1783,"date_min":1783,"date_max":1783,"modality":"auditory","text":"Butler . JOHN BUTLER sworn. I am watchman on the quay , I had a cargo of frail raisins and 600 jar raisins, I watch in the day. JOHN TURNER sworn. On the 31st of May at four in the morning I heard a noise among the hurdles, and saw the prisoner run away with a bundle, which was a jacket full of plumbs, and jump on board a ship, in the hold of a Portugueze ship, I went into the cabbin to call u","context":"noise","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17900224-65","pub_year":1790,"date_min":1790,"date_max":1790,"modality":"thermal","text":"301. THOMAS ANDERSON was indicted for feloniously stealing, on the 24th of February , in the parish of St. Botolph, Billingsgate, eight pounds weight of raw sugar, of the value of 2 s. the property of Joseph Seaborne , Robert Waghorne , and Co. HENRY VANTRIS sworn. On the 24th of February I was on the wharf, and saw the prisoner at the bar coming out","context":"raw","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17900526-86","pub_year":1790,"date_min":1790,"date_max":1790,"modality":"thermal","text":"524. JAMES DAVIS was indicted for stealing, on the 30th of April last, twenty pounds weight of raw sugar, value 8 s. the property of Richard Taylor . RICHARD TAYLOR sworn. I am a warehouse-man ; this sugar was in my care. EDWARD BISHOP sworn. I am a working man. On the 30th of April, I saw the","context":"raw","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17940430-92","pub_year":1794,"date_min":1794,"date_max":1794,"modality":"thermal","text":"320. JAMES SMITH was indicted for stealing, on the 24th of February twenty-seven pounds weight of raw sugar, value 10s. the goods of Thomas Bolt . CHARLES WOOD sworn. I am a watchman of Smarts and Dice Key. On Monday, the 24th of FebruaryI stopped the prisoner with a bundle of sugar, at seven o'cl","context":"raw","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t18010916-24","pub_year":1801,"date_min":1801,"date_max":1801,"modality":"visual","text":"on the 1st of September , a sow pig, value 15s. the property of Richard Alcock . RICHARD ALCOCK sworn. - I am a butcher in Aldgate High-street: On Tuesday, the 1st of September, I lost a sow-pig from Narrow-alley, I missed it about ten o'clock in the morning; I was looking about two hours and a half for it, and then I learnt that it had got into Honey-lane Market; I y for Breaking the House of Thomas Harwood , and taking thence divers Goods of Thomas Harwoods","context":"dark","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16970224-29","pub_year":1697,"date_min":1697,"date_max":1697,"modality":"auditory","text":"that he came from Park Hall in Essex and set up his Horse in White Chappell, and took his Bags, and was going to pay the Money to the Countess; but coming down Leaden-hall street , there was a great Tumult, they threw the Prosecutor down, and the Prisoner fell","context":"Tumult","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t16980504-45","pub_year":1698,"date_min":1698,"date_max":1698,"modality":"crowd","text":"d other Goods . The Prosecutor deposed, that her House was broke open, and the Goods taken out; and on searching the Prisoner, part of the Goods were found about her, and the other part brought to an empty House, where the Prisoner pretended to take a Lodging. There being no Evidence as to the Burglary, she was found Guilty","context":"empty","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17141209-51","pub_year":1714,"date_min":1714,"date_max":1714,"modality":"auditory","text":"Thomas Hubbub and William Hall of the Parish of St. Martin in the Fields , were indicted for breaking the House of James Rod in the Night-time, and stealing thence several Pieces of Linnen , on the 5th insta","context":"Hubbub","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17150907-7","pub_year":1715,"date_min":1715,"date_max":1715,"modality":"visual","text":"ing and Wounding Thomas Morton , a Constable , on the 28th of May last. It appear'd a great Mob came into Basing-hall street about 11 a Clock that Night, hollowing, and breaking the Windows that were illuminated, and committing other Disorders; upon which Mr. Morton went to them, and de and in our Kitchen, and says he, you have a very beautiful Ring, let me see it: then he took hold of my Hand, and took it off my Finger; Madam, says he, there is a Noise at your Door, and up he got, and away he ran","context":"Noise","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17440912-13","pub_year":1744,"date_min":1744,"date_max":1744,"modality":"crowd","text":"ds of John Dale , in his shop , July 21 . Elizabeth Dale . I keep a shop in Leadenhall Market and deal in lace, the Prisoner came into the shop between 7 and 8 at night, and asked for some lace for a mob, and bid me 3 s. and 6 d. a yard for some; (she held her apron up, and in a clandestine manner doubled a piece of lace up and concealed it in her left hand that held her apron up, and her","context":"mob","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17460226-6","pub_year":1746,"date_min":1746,"date_max":1746,"modality":"auditory","text":"to Mr. Edge . In about five Minutes Time I turn'd to see it they were all safe , and I missed one Side. I was making Enquiry about it and Mr. Simson said, he saw a Man carry away a Side of Pork . We cry'd out, Stop Thief. The","context":"cry","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17530221-14","pub_year":1753,"date_min":1753,"date_max":1753,"modality":"auditory","text":"stealing one hat value 5 s. the property of Isaac Dias Fanandus , privately from his person , Jan. 14 . || Thomas Lake. I keep an optical shop in Leaden-hall-street. I was in the shop, and heard the cry stop thief! between 5 and 6 o'clock on the 14th of Jan. and saw the prisoner run by my shop door from a gentleman that was without a hat; I said to the gentleman, what, have you been robbed of? he","context":"cry","valence":"unpleasant"},{"source_type":"legal","author":"Old Bailey Proceedings","title":"Trial t17811017-61","pub_year":1781,"date_min": // ── Leaflet map ───────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([51.51, -0.13], 13);

const baseLayers = {
  'Modern (CartoDB)': L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    { attribution: '&copy; OpenStreetMap contributors &copy; CARTO', maxZoom: 19 }
  ).addTo(map),
  'Rocque 1746': L.tileLayer(
    'https://www.dhi.ac.uk/san/llptiles/molarocque/{z}/{x}/{y}.png',
    { attribution: 'Map tiles &copy; Museum of London Archaeology / DHI, based on John Rocque 1746',
      minZoom: 13, maxZoom: 15, maxNativeZoom: 15, opacity: 0.9 }
  ),
  'Horwood 1792–99': L.tileLayer(
    'https://www.romanticlondon.org/horwoodplan/{z}/{x}/{y}.png',
    { attribution: 'Map tiles &copy; Romantic London project, based on Richard Horwood 1792–99',
      minZoom: 11, maxZoom: 17, maxNativeZoom: 16, opacity: 0.9 }
  ),
};
L.control.layers(baseLayers, {}, { collapsed: false }).addTo(map);

// ── state ─────────────────────────────────────────────────────────────────
const state = {
  modalities:      new Set(['auditory','olfactory','visual','thermal','crowd']),
  sources:         new Set(['fiction','diary','topography','poetry','letters','legal']),
  dateFrom:        1660,
  dateTo:          1820,
  selectedId:      null,
  panelModalities: new Set(['auditory','olfactory','visual','thermal','crowd']),
};

// ── helpers ───────────────────────────────────────────────────────────────
function matchesGlobal(ev) {
  return state.modalities.has(ev.modality)
      && state.sources.has(ev.source_type)
      && (ev.date_max === null || ev.date_max >= state.dateFrom)
      && (ev.date_min === null || ev.date_min <= state.dateTo);
}

function markerRadius(total) {
  return 6 + Math.log1p(total) * 3;
}

// ── markers ───────────────────────────────────────────────────────────────
const markers = {};

function renderMarkers() {
  VENUES.forEach(function(v) {
    const count  = v.evidence.filter(matchesGlobal).length;
    const total  = v.evidence.length;
    const active = count > 0;
    const sel    = state.selectedId === v.id;
    const r      = markerRadius(total || 1);

    const opts = {
      radius:      r,
      color:       sel ? '#2c3e50' : (active ? '#8b6914' : '#999'),
      fillColor:   active ? '#c9a84c' : '#ccc',
      fillOpacity: sel ? 0.95 : (active ? 0.70 : 0.35),
      weight:      sel ? 2.5 : 1.5,
    };

    if (markers[v.id]) {
      markers[v.id].setStyle(opts);
      markers[v.id].setRadius(r);
    } else {
      const m = L.circleMarker([v.lat, v.lon], opts).addTo(map);
      m.bindTooltip(v.name + (total ? ' (' + total + ')' : ''), { sticky: true });
      m.on('click', function() { openPanel(v.id); });
      markers[v.id] = m;
    }
  });
}

// ── side panel ────────────────────────────────────────────────────────────
const SOURCE_CLASSES = {
  fiction: 'src-fiction', diary: 'src-diary',
  topography: 'src-topography', poetry: 'src-poetry',
  letters: 'src-letters', legal: 'src-legal',
};

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderCard(ev) {
  const cls     = SOURCE_CLASSES[ev.source_type] || 'src-letters';
  const text    = ev.text.length > 380 ? ev.text.slice(0, 380) + '…' : ev.text;
  const dateStr = ev.pub_year
    ? (ev.date_min && ev.date_min !== ev.pub_year
        ? ev.pub_year + ' · set ' + ev.date_min
          + (ev.date_max != null ? '–' + ev.date_max : '')
        : String(ev.pub_year))
    : (ev.date_min
        ? 'c. ' + ev.date_min
          + (ev.date_max != null ? '–' + ev.date_max : '')
        : '');
  return '<div class="ev-card">'
    + '<div class="ev-card-head">'
    + '<span class="source-badge ' + cls + '">' + ev.source_type + '</span>'
    + '<span class="ev-author">' + esc(ev.author) + '</span>'
    + '<span class="ev-title">' + esc(ev.title) + '</span>'
    + (ev.valence === 'unpleasant' ? '<span class="valence-pip unpleasant" title="unpleasant"></span>'
       : ev.valence === 'pleasant'  ? '<span class="valence-pip pleasant" title="pleasant"></span>'
       : '')
    + '</div>'
    + '<div class="ev-date">' + dateStr + '</div>'
    + '<div class="ev-text">“' + esc(text) + '”</div>'
    + '<div class="ev-footer"><span class="context-chip">' + esc(ev.context) + '</span></div>'
    + '</div>';
}

function renderPanel() {
  const v = VENUES.find(function(x) { return x.id === state.selectedId; });
  if (!v) return;

  const globalFiltered = v.evidence.filter(matchesGlobal);
  const filtered = globalFiltered.filter(function(ev) {
    return state.panelModalities.has(ev.modality);
  });

  // modality breakdown for header
  const breakdown = {};
  globalFiltered.forEach(function(ev) {
    breakdown[ev.modality] = (breakdown[ev.modality] || 0) + 1;
  });
  const bStr = Object.entries(breakdown)
    .sort(function(a,b) { return b[1]-a[1]; })
    .map(function(e) { return e[1] + ' ' + e[0]; })
    .join(' · ') || 'no matches';

  document.getElementById('panel-title').textContent = v.name;
  document.getElementById('panel-stats').textContent =
    globalFiltered.length + ' passage' + (globalFiltered.length !== 1 ? 's' : '') + ' · ' + bStr;

  // local modality pills
  const pillsEl = document.getElementById('panel-pills');
  pillsEl.innerHTML = ['auditory','olfactory','visual','thermal','crowd'].map(function(m) {
    const active = state.panelModalities.has(m) ? ' active' : '';
    return '<button class="pill' + active + '" data-panel-mod="' + m + '">'
      + m.charAt(0).toUpperCase() + m.slice(1) + '</button>';
  }).join('');

  // evidence cards
  const listEl = document.getElementById('evidence-list');
  listEl.innerHTML = filtered.length
    ? filtered.map(renderCard).join('')
    : '<div class="no-evidence">No evidence matches current filters.</div>';

  document.getElementById('panel-placeholder').style.display = 'none';
  document.getElementById('panel-header').style.display      = 'block';
  document.getElementById('evidence-list').style.display     = 'block';
}

function openPanel(venueId) {
  state.selectedId      = venueId;
  state.panelModalities = new Set(['auditory','olfactory','visual','thermal','crowd']);
  renderPanel();
  renderMarkers();
}

// ── filter wiring ─────────────────────────────────────────────────────────
document.querySelectorAll('.pill[data-f]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    const f   = btn.dataset.f;
    const v   = btn.dataset.v;
    const set = f === 'modality' ? state.modalities : state.sources;
    if (set.has(v)) { set.delete(v); btn.classList.remove('active'); }
    else            { set.add(v);    btn.classList.add('active');    }
    renderMarkers();
    if (state.selectedId) renderPanel();
  });
});

document.getElementById('panel-pills').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-panel-mod]');
  if (!btn) return;
  const m = btn.dataset.panelMod;
  if (state.panelModalities.has(m)) state.panelModalities.delete(m);
  else                               state.panelModalities.add(m);
  renderPanel();
});

document.getElementById('date-from').addEventListener('input', function() {
  const val      = parseInt(this.value);
  const toSlider = document.getElementById('date-to');
  if (val > parseInt(toSlider.value)) {
    toSlider.value = val;
    state.dateTo = val;
    document.getElementById('lbl-to').textContent = val;
  }
  state.dateFrom = val;
  document.getElementById('lbl-from').textContent = val;
  renderMarkers();
  if (state.selectedId) renderPanel();
});

document.getElementById('date-to').addEventListener('input', function() {
  const val        = parseInt(this.value);
  const fromSlider = document.getElementById('date-from');
  if (val < parseInt(fromSlider.value)) {
    fromSlider.value = val;
    state.dateFrom = val;
    document.getElementById('lbl-from').textContent = val;
  }
  state.dateTo = val;
  document.getElementById('lbl-to').textContent = val;
  renderMarkers();
  if (state.selectedId) renderPanel();
});

// ── initial render ────────────────────────────────────────────────────────
renderMarkers();
</script>
