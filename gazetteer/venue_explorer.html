en it came, but she did not depend on it.\n\nMrs. Allen was so long in dressing that they did not enter the ballroom\ntill late. The season was full","context":"crowd"},{"source_type":"fiction","author":"Austen","title":"Northanger Abbey","pub_year":1817,"date_min":1798,"date_max":1799,"modality":"crowd","text":"the ballroom\ntill late. The season was full, the room crowded, and the two ladies\nsqueezed in as well as they could. As for Mr. Allen, he repaired\ndirectly to the card-room, and left them to enjoy a mob by themselves.\nWith more care for the safety of her new gown than for the comfort of\nher protégée, Mrs. Allen made her way through the throng of men by the\ndoor, as swiftly as the necessary cautio","context":"mob"},{"source_type":"fiction","author":"Austen","title":"Northanger Abbey","pub_year":1817,"date_min":1798,"date_max":1799,"modality":"crowd","text":"repaired\ndirectly to the card-room, and left them to enjoy a mob by themselves.\nWith more care for the safety of her new gown than for the comfort of\nher protégée, Mrs. Allen made her way through the throng of men by the\ndoor, as swiftly as the necessary caution would allow; Catherine,\nhowever, kept close at her side, and linked her arm too firmly within\nher friend’s to be torn asunder by any comm","context":"throng"},{"source_type":"fiction","author":"Austen","title":"Northanger Abbey","pub_year":1817,"date_min":1798,"date_max":1799,"modality":"crowd","text":"friend’s to be torn asunder by any common effort of a struggling\nassembly. But to her utter amazement she found that to proceed along\nthe room was by no means the way to disengage themselves from the\ncrowd; it seemed rather to increase as they went on, whereas she had\nimagined that when once fairly within the door, they should easily find\nseats and be able to watch the dances with perfect convenie","context":"crowd"},{"source_type":"fiction","author":"Austen","title":"Northanger Abbey","pub_year":1817,"date_min":1798,"date_max":1799,     };

    if (markers[v.id]) {
      markers[v.id].setStyle(opts);
      markers[v.id].setRadius(r);
    } else {
      const m = L.circleMarker([v.lat, v.lon], opts).addTo(map);
      m.bindTooltip(v.name + (total ? ' (' + total + ')' : ''), { sticky: true });
      m.on('click', function() { openPanel(v.id); });
      markers[v.id] = m;
    }
  });
}

// ── side panel ────────────────────────────────────────────────────────────
const SOURCE_CLASSES = {
  fiction: 'src-fiction', diary: 'src-diary',
  topography: 'src-topography', poetry: 'src-poetry', letters: 'src-letters',
};

function renderCard(ev) {
  const cls     = SOURCE_CLASSES[ev.source_type] || 'src-letters';
  const text    = ev.text.length > 380 ? ev.text.slice(0, 380) + '…' : ev.text;
  const dateStr = ev.pub_year
    ? (ev.date_min && ev.date_min !== ev.pub_year
        ? ev.pub_year + ' · set ' + ev.date_min + '–' + ev.date_max
        : String(ev.pub_year))
    : (ev.date_min ? 'c. ' + ev.date_min + '–' + ev.date_max : '');
  return '<div class="ev-card">'
    + '<div class="ev-card-head">'
    + '<span class="source-badge ' + cls + '">' + ev.source_type + '</span>'
    + '<span class="ev-author">' + ev.author + '</span>'
    + '<span class="ev-title">' + ev.title + '</span>'
    + '</div>'
    + '<div class="ev-date">' + dateStr + '</div>'
    + '<div class="ev-text">“' + text + '”</div>'
    + '<div class="ev-footer"><span class="context-chip">' + ev.context + '</span></div>'
    + '</div>';
}

function renderPanel() {
  const v = VENUES.find(function(x) { return x.id === state.selectedId; });
  if (!v) return;

  const globalFiltered = v.evidence.filter(matchesGlobal);
  const filtered = globalFiltered.filter(function(ev) {
    return state.panelModalities.has(ev.modality);
  });

  // modality breakdown for header
  const breakdown = {};
  globalFiltered.forEach(function(ev) {
    breakdown[ev.modality] = (breakdown[ev.modality] || 0) + 1;
  });
  const bStr = Object.entries(breakdown)
    .sort(function(a,b) { return b[1]-a[1]; })
    .map(function(e) { return e[1] + ' ' + e[0]; })
    .join(' · ') || 'no matches';

  document.getElementById('panel-title').textContent = v.name;
  document.getElementById('panel-stats').textContent =
    filtered.length + ' passage' + (filtered.length !== 1 ? 's' : '') + ' · ' + bStr;

  // local modality pills
  const pillsEl = document.getElementById('panel-pills');
  pillsEl.innerHTML = ['auditory','olfactory','visual','thermal','crowd'].map(function(m) {
    const active = state.panelModalities.has(m) ? ' active' : '';
    return '<button class="pill' + active + '" data-panel-mod="' + m + '">'
      + m.charAt(0).toUpperCase() + m.slice(1) + '</button>';
  }).join('');

  // evidence cards
  const listEl = document.getElementById('evidence-list');
  listEl.innerHTML = filtered.length
    ? filtered.map(renderCard).join('')
    : '<div class="no-evidence">No evidence matches current filters.</div>';

  document.getElementById('panel-placeholder').style.display = 'none';
  document.getElementById('panel-header').style.display      = 'block';
  document.getElementById('evidence-list').style.display     = 'block';
}

function openPanel(venueId) {
  state.selectedId      = venueId;
  state.panelModalities = new Set(['auditory','olfactory','visual','thermal','crowd']);
  renderPanel();
  renderMarkers();
}

// ── filter wiring ─────────────────────────────────────────────────────────
document.querySelectorAll('.pill[data-f]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    const f   = btn.dataset.f;
    const v   = btn.dataset.v;
    const set = f === 'modality' ? state.modalities : state.sources;
    if (set.has(v)) { set.delete(v); btn.classList.remove('active'); }
    else            { set.add(v);    btn.classList.add('active');    }
    renderMarkers();
    if (state.selectedId) renderPanel();
  });
});

document.getElementById('panel-pills').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-panel-mod]');
  if (!btn) return;
  const m = btn.dataset.panelMod;
  if (state.panelModalities.has(m)) state.panelModalities.delete(m);
  else                               state.panelModalities.add(m);
  renderPanel();
});

document.getElementById('date-from').addEventListener('input', function() {
  const val      = parseInt(this.value);
  const toSlider = document.getElementById('date-to');
  if (val > parseInt(toSlider.value)) { toSlider.value = val; state.dateTo = val; }
  state.dateFrom = val;
  document.getElementById('lbl-from').textContent = val;
  renderMarkers();
  if (state.selectedId) renderPanel();
});

document.getElementById('date-to').addEventListener('input', function() {
  const val        = parseInt(this.value);
  const fromSlider = document.getElementById('date-from');
  if (val < parseInt(fromSlider.value)) { fromSlider.value = val; state.dateFrom = val; }
  state.dateTo = val;
  document.getElementById('lbl-to').textContent = val;
  renderMarkers();
  if (state.selectedId) renderPanel();
});

// ── initial render ────────────────────────────────────────────────────────
renderMarkers();
</script>
